name: Testes automáticos VeloBot RA

# Dispara o endpoint /api/cron/teste-automatico 3x/dia (horário de Brasília, UTC-3 fixo, sem
# horário de verão). Usa GitHub Actions em vez do cron da Vercel de propósito: cron com múltiplos
# horários por dia normalmente exige plano Pro da Vercel; assim fica gratuito independente do
# plano. O endpoint roda os testes (só leitura, não grava nada na planilha) e envia o relatório
# por e-mail; este workflow só dispara a chamada HTTP e falha visivelmente se o teste não rodar.
on:
  schedule:
    # Minutos fora de horas/meias-horas "redondas" (evita a fila mais concorrida do GitHub
    # Actions nesses horarios, que causou atrasos de 2-4h observados em 2026-09-09).
    - cron: '37 12 * * *'  # ~09:37 BRT
    - cron: '37 16 * * *'  # ~13:37 BRT
    - cron: '37 20 * * *'  # ~17:37 BRT
  workflow_dispatch:
    inputs:
      horario:
        description: 'Rótulo do horário (só pra identificar no relatório/log)'
        required: false
        default: 'manual'

jobs:
  disparar-teste:
    runs-on: ubuntu-latest
    steps:
      - name: Definir rótulo do horário
        id: horario
        run: |
          case "${{ github.event.schedule }}" in
            '37 12 * * *') echo "label=09:37" >> "$GITHUB_OUTPUT" ;;
            '37 16 * * *') echo "label=13:37" >> "$GITHUB_OUTPUT" ;;
            '37 20 * * *') echo "label=17:37" >> "$GITHUB_OUTPUT" ;;
            *) echo "label=${{ github.event.inputs.horario || 'manual' }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Chamar /api/cron/teste-automatico
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ vars.VELOBOT_BASE_URL || 'https://velotax-bot-v2.vercel.app' }}
        run: |
          curl -fsS --max-time 280 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/teste-automatico?horario=${{ steps.horario.outputs.label }}"
